name: Go Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...

    - name: Create Release Binary
      run: |
        GOOS=linux GOARCH=amd64 go build -o smartaudit-linux ./cmd/smartaudit
        GOOS=darwin GOARCH=amd64 go build -o smartaudit-mac ./cmd/smartaudit
        GOOS=windows GOARCH=amd64 go build -o smartaudit.exe ./cmd/smartaudit
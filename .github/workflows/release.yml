name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: Build
      run: |
        make cross-compile

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/smartaudit-windows-amd64.exe
          dist/smartaudit-darwin-amd64
          dist/smartaudit-linux-amd64